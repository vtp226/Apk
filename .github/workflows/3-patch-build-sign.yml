name: 3 - Patch, build and sign APK

on:
  workflow_dispatch: {}

jobs:
  patch-build-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Decompile APK
        run: |
          apktool d game-original.apk -o decompiled -f

      - name: Apply patches with Python (fails loudly if any anchor doesn't match exactly once)
        run: |
          python3 << 'PYEOF'
          import sys

          def patch(path, old, new, expect=1):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              count = content.count(old)
              if count != expect:
                  print(f"ERROR in {path}: expected {expect} match(es), found {count}")
                  print("----- looking for -----")
                  print(old)
                  sys.exit(1)
              content = content.replace(old, new)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"OK patched: {path} ({old[:40]!r} -> {new[:40]!r})")

          P = "decompiled/smali/com/corrodinggames/rts/game/p.smali"
          M = "decompiled/smali/com/corrodinggames/rts/appFramework/MultiplayerBattleroomActivity.smali"

          # 1) master slot count in <clinit> (drives c, f, and the two color arrays)
          patch(P,
              ".method static strictfp constructor <clinit>()V\n    .locals 3\n\n    .prologue\n    const/4 v1, 0x0\n\n    const/16 v2, 0xa\n",
              ".method static strictfp constructor <clinit>()V\n    .locals 3\n\n    .prologue\n    const/4 v1, 0x0\n\n    const/16 v2, 0x14\n"
          )

          # 2) hex color count validation (method d)
          patch(P,
              ".method private static strictfp d(Ljava/lang/String;)V\n    .locals 5\n\n    .prologue\n    const/16 v4, 0xa\n",
              ".method private static strictfp d(Ljava/lang/String;)V\n    .locals 5\n\n    .prologue\n    const/16 v4, 0x14\n"
          )
          patch(P, "Expected 10 hex colors", "Expected 20 hex colors")

          # 3) color-name count validation (method e)
          patch(P,
              ".method private static strictfp e(Ljava/lang/String;)V\n    .locals 5\n\n    .prologue\n    const/16 v4, 0xa\n",
              ".method private static strictfp e(Ljava/lang/String;)V\n    .locals 5\n\n    .prologue\n    const/16 v4, 0x14\n"
          )
          patch(P, "Expected 10 team color names", "Expected 20 team color names")

          # 4) hardcoded fallback color list + names -> extended to 20 each
          patch(P,
              "#00ff00,#d02013,#0463f3,#ffff40,#00ffff,#d0f8f7,#000000,#ff00ea,#ff7f18,#9368c4",
              "#00ff00,#d02013,#0463f3,#ffff40,#00ffff,#d0f8f7,#000000,#ff00ea,#ff7f18,#9368c4,#808080,#a52a2a,#008080,#ff8c00,#4b0082,#adff2f,#ff1493,#1e90ff,#b8860b,#2e8b57"
          )
          patch(P,
              "GREEN,RED,BLUE,YELLOW,CYAN,WHITE,BLACK,PINK,ORANGE,PURPLE",
              "GREEN,RED,BLUE,YELLOW,CYAN,WHITE,BLACK,PINK,ORANGE,PURPLE,GRAY,BROWN,TEAL,DARKORANGE,INDIGO,YELLOWGREEN,DEEPPINK,DODGERBLUE,DARKGOLDENROD,SEAGREEN"
          )

          # 5) battleroom UI: color dropdown loop bound (0..9 -> 0..19)
          patch(M,
              ".line 3077\n    :goto_0\n    const/16 v0, 0xa\n\n    if-ge v3, v0, :cond_3\n",
              ".line 3077\n    :goto_0\n    const/16 v0, 0x14\n\n    if-ge v3, v0, :cond_3\n"
          )

          # 6) battleroom UI: team dropdown loop bound (0..9 inclusive -> 0..19 inclusive)
          patch(M,
              ".line 3174\n    :goto_2\n    const/16 v4, 0x9\n\n    if-gt v0, v4, :cond_2\n",
              ".line 3174\n    :goto_2\n    const/16 v4, 0x13\n\n    if-gt v0, v4, :cond_2\n"
          )

          print("ALL PATCHES APPLIED SUCCESSFULLY")
          PYEOF

      - name: Build patched APK
        run: |
          apktool b decompiled -o game-patched-unsigned.apk

      - name: Generate a personal signing key
        run: |
          keytool -genkey -v \
            -keystore my-release-key.jks \
            -alias mykey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Local, OU=Local, O=Local, L=Local, S=Local, C=US"

      - name: Sign the APK (jar signing, works fine for sideloading)
        run: |
          cp game-patched-unsigned.apk game-patched-signed.apk
          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore my-release-key.jks -storepass android123 \
            game-patched-signed.apk mykey
          jarsigner -verify game-patched-signed.apk

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: game-patched-signed-apk
          path: game-patched-signed.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: decompiled
          if-no-files-found: warn
