      - name: Enable large heap (less GC stutter with big armies / many team colors)
        run: |
          python3 - << 'PYEOF'
          import re
          p = "decompiled/AndroidManifest.xml"
          t = open(p, encoding="utf-8").read()
          assert t.count("<application") == 1, "expected exactly one <application> tag"
          if "android:largeHeap" in t:
              t = re.sub(r'android:largeHeap="[^"]*"', 'android:largeHeap="true"', t)
          else:
              t = t.replace("<application", '<application android:largeHeap="true"', 1)
          open(p, "w", encoding="utf-8").write(t)
          print("largeHeap enabled:", 'android:largeHeap="true"' in t)
          PYEOF

      - name: Build patched APK
        run: |
          apktool b --use-aapt2 decompiled -o game-patched-unsigned.apk

      - name: Generate a personal signing key
        run: |
          keytool -genkey -v \
            -keystore my-release-key.jks \
            -alias mykey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Local, OU=Local, O=Local, L=Local, S=Local, C=US"

      - name: Locate Android build-tools (zipalign + apksigner, preinstalled on this runner)
        id: bt
        run: |
          BT_DIR=$(find "$ANDROID_HOME"/build-tools -maxdepth 1 -type d | sort -V | tail -n1)
          echo "Using build-tools at: $BT_DIR"
          echo "dir=$BT_DIR" >> "$GITHUB_OUTPUT"
          ls "$BT_DIR"

      - name: Zipalign
        run: |
          "${{ steps.bt.outputs.dir }}/zipalign" -f -p 4 game-patched-unsigned.apk game-patched-aligned.apk

      - name: Sign with apksigner (v1+v2+v3, works on modern Android)
        run: |
          "${{ steps.bt.outputs.dir }}/apksigner" sign \
            --ks my-release-key.jks \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --ks-key-alias mykey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out game-patched-signed.apk \
            game-patched-aligned.apk

          "${{ steps.bt.outputs.dir }}/apksigner" verify --verbose game-patched-signed.apk

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: game-patched-signed-apk
          path: game-patched-signed.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: decompiled
          if-no-files-found: warn
