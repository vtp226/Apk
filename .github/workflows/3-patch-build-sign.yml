              sput-object v0, Lcom/corrodinggames/rts/game/a/Adapt;->e:Ljava/util/HashMap;

              return-void
          .end method

          .method private static s()V
              .locals 11

              invoke-static {}, Ljava/lang/System;->currentTimeMillis()J

